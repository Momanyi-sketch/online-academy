{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Access Restricted | Pure and Applied Mathematics Academy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<section class="access-denied-section">

    <div class="access-denied-card">

        <div class="lock-icon">🔒</div>

        <h1>Course Access Restricted</h1>

        <p>
            You are not currently enrolled in
            <strong>{{ course.title }}</strong>.
        </p>

        <p>
            Enrol in this course to access its lessons and learning materials.
        </p>

        <a href="{% url 'course_detail' course.slug %}"
           class="btn btn-primary">
            Return to Course
        </a>

        <a href="{% url 'student_dashboard' %}"
           class="btn btn-outline-primary mt-2">
            My Dashboard
        </a>

    </div>

</section>

</body>
</html>
